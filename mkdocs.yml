site_name: Interpretador em Python - Equipe 13
site_description: Projeto de Compiladores 1 - Interpretador em Python desenvolvido pela Equipe 13
site_url: https://compiladores-1-grupo13-2026.github.io/Compiladores-1/
repo_url: https://github.com/Compiladores-1-Grupo13-2026/Compiladores-1
repo_name: Compiladores-1

docs_dir: docs

theme:
  name: material
  language: pt-BR
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Ativar modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Ativar modo claro
  features:
    - navigation.tabs
    - navigation.top
    - navigation.instant
    - search.suggest
    - content.code.copy

nav:
  - Início: index.md
  - Analisador Léxico: analisador-lexico.md
  - Analisador Sintático: analisador-sintatico.md
  - Analisador Semântico: analisador-semantico.md
  - Código-fonte: src.md
  - Testes: testes.md
